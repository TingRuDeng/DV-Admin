name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - master
      - main

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.13"

jobs:
  production-images:
    name: Production Image (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        backend: [backend, fastapi]
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Build and verify the production artifact
        run: python3 scripts/verify_production_images.py --backend ${{ matrix.backend }}

  frontend:
    name: Frontend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Validate docs
        run: |
          python3 scripts/validate_docs.py . --profile generic
          python3 scripts/validate_api_contracts.py .
          python3 scripts/validate_model_contracts.py .
          python3 scripts/validate_route_components.py .
          python3 scripts/validate_django_migrations.py .
          python3 -m unittest discover -s tests -p "test_*.py"
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        working-directory: frontend
        run: pnpm run audit:prod
      - name: Run quality checks
        working-directory: frontend
        run: pnpm run quality
      - name: Run build
        working-directory: frontend
        run: pnpm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E smoke tests
        working-directory: frontend
        run: pnpm run test:e2e:smoke
      - name: Upload frontend Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Django Backend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Use Python 3.11 from runner toolcache
        run: |
          PY_DIR=$(find /opt/hostedtoolcache/Python -maxdepth 1 -type d -name '3.11.*' | sort -V | tail -n 1)
          test -n "$PY_DIR"
          echo "$PY_DIR/x64/bin" >> "$GITHUB_PATH"
          "$PY_DIR/x64/bin/python" --version
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --group dev
      - name: Install isolated login security store
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Create .env.test
        working-directory: backend
        run: |
          echo "SECRET_KEY=test-secret-key" > .env.test
          echo "DEBUG=False" >> .env.test
          echo "ALLOWED_HOSTS=127.0.0.1,localhost,testserver" >> .env.test
          echo "DATABASE_URL=sqlite:///./test.sqlite3" >> .env.test
          echo "CORS_ALLOWED_ORIGINS=http://localhost:9527,http://127.0.0.1:9527" >> .env.test
          echo "EXTRA_INSTALLED_APPS=" >> .env.test
          echo "DEFAULT_PWD=test-default-password" >> .env.test
      - name: Run lint
        working-directory: backend
        run: .venv/bin/ruff check .
      - name: Run tests
        working-directory: backend
        run: .venv/bin/pytest
      - name: Run API contract tests
        working-directory: backend
        run: .venv/bin/pytest drf_admin/utils/test_response_contract.py

  fastapi:
    name: FastAPI Backend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: migration-test-password
          MYSQL_DATABASE: dv_admin_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pmigration-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Use Python 3.10 from runner toolcache
        run: |
          PY_DIR=$(find /opt/hostedtoolcache/Python -maxdepth 1 -type d -name '3.10.*' | sort -V | tail -n 1)
          test -n "$PY_DIR"
          echo "$PY_DIR/x64/bin" >> "$GITHUB_PATH"
          "$PY_DIR/x64/bin/python" --version
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Install dependencies
        working-directory: fastapi
        run: uv sync --frozen --group dev
      - name: Create .env
        working-directory: fastapi
        run: |
          cp .env.example .env
          echo "SECRET_KEY=test-secret-key" >> .env
          echo "APP_ENV=test" >> .env
      - name: Install isolated security smoke tools
        run: sudo apt-get update && sudo apt-get install -y redis-server nginx
      - name: Run production proxy probe smoke
        run: python -m unittest discover -s tests -p 'test_nginx_health_proxy.py'
      - name: Run quality gate
        working-directory: fastapi
        run: make quality
      - name: Run MySQL migration smoke
        working-directory: fastapi
        run: >-
          .venv/bin/python scripts/validate_migrations.py fresh
          --database-url
          mysql://root:migration-test-password@127.0.0.1:3306/dv_admin_migration_test
      - name: Create isolated MySQL incremental migration database
        working-directory: fastapi
        run: >-
          .venv/bin/python -c
          "import pymysql;
          connection = pymysql.connect(
              host='127.0.0.1',
              port=3306,
              user='root',
              password='migration-test-password',
              autocommit=True,
          );
          connection.cursor().execute(
              'CREATE DATABASE dv_admin_migration_incremental '
              'CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          );
          connection.close()"
      - name: Run MySQL incremental migration smoke
        working-directory: fastapi
        run: >-
          .venv/bin/python scripts/validate_migrations.py incremental
          --database-url
          mysql://root:migration-test-password@127.0.0.1:3306/dv_admin_migration_incremental

  mysql-grant-concurrency:
    name: MySQL Grant Concurrency (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: django
            project_dir: backend
            python_pattern: 3.11.*
          - backend: fastapi
            project_dir: fastapi
            python_pattern: 3.10.*
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysql-grant-ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pmysql-grant-ci-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Use backend Python from runner toolcache
        run: |
          PY_DIR=$(find /opt/hostedtoolcache/Python -maxdepth 1 -type d -name '${{ matrix.python_pattern }}' | sort -V | tail -n 1)
          test -n "$PY_DIR"
          echo "$PY_DIR/x64/bin" >> "$GITHUB_PATH"
          "$PY_DIR/x64/bin/python" --version
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Install frozen dependencies
        working-directory: ${{ matrix.project_dir }}
        run: uv sync --frozen --group dev
      - name: Create Django test configuration
        if: matrix.backend == 'django'
        working-directory: backend
        run: |
          echo 'SECRET_KEY=mysql-grant-ci-only-key-not-for-production' > .env.test
          echo 'EXTRA_INSTALLED_APPS=' >> .env.test
      - name: Verify grant races and rollback in both isolation levels
        env:
          GRANT_MYSQL_PASSWORD: mysql-grant-ci-only-password
        run: ${{ matrix.project_dir }}/.venv/bin/python scripts/verify_mysql_grants.py --backend ${{ matrix.backend }}

  real-backend-browser:
    name: Real Backend Browser Smoke (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: Django
            project_dir: backend
            python_pattern: 3.11.*
            test_target: drf_admin/utils/runtime_api_contracts/test_live_http_contract.py::DjangoLiveHttpContractTestCase::test_shared_frontend_flow_over_real_django_http
          - backend: FastAPI
            project_dir: fastapi
            python_pattern: 3.10.*
            test_target: tests/test_live_http_contract.py::test_shared_frontend_flow_over_real_fastapi_http
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Use Python from runner toolcache
        run: |
          PY_DIR=$(find /opt/hostedtoolcache/Python -maxdepth 1 -type d -name '${{ matrix.python_pattern }}' | sort -V | tail -n 1)
          test -n "$PY_DIR"
          echo "$PY_DIR/x64/bin" >> "$GITHUB_PATH"
          "$PY_DIR/x64/bin/python" --version
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Install backend dependencies
        working-directory: ${{ matrix.project_dir }}
        run: uv sync --frozen --group dev
      - name: Install isolated login security store
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Create FastAPI test environment
        if: matrix.backend == 'FastAPI'
        working-directory: fastapi
        run: |
          cp .env.example .env
          echo "SECRET_KEY=test-secret-key" >> .env
          echo "APP_ENV=test" >> .env
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run real backend browser smoke
        working-directory: ${{ matrix.project_dir }}
        env:
          RUN_REAL_BACKEND_PLAYWRIGHT: "1"
        run: .venv/bin/pytest '${{ matrix.test_target }}'
      - name: Upload real backend Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-backend-playwright-${{ matrix.backend }}-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
