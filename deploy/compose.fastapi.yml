x-build: &build
  context: ../fastapi
  dockerfile: docker/Dockerfile
x-environment: &environment
  APP_ENV: production
  DEBUG: "false"
  UPLOAD_DIR: /data/media
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:?set a compliant DEFAULT_PASSWORD}
  DATABASE_URL: ${DATABASE_URL:?set the FastAPI database URL}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:9527}
  REDIS_URL: redis://redis:6379/0
  TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
  OIDC_ENABLED: ${OIDC_ENABLED:-false}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
  OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
  OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-true}
  OIDC_MATCH_EXISTING_BY_EMAIL: ${OIDC_MATCH_EXISTING_BY_EMAIL:-false}
  OIDC_ALLOWED_EMAIL_DOMAINS: ${OIDC_ALLOWED_EMAIL_DOMAINS:-}
services:
  api:
    build: *build
    environment: *environment
  migrate:
    build: *build
    restart: "no"
    environment: *environment
    command: python -m tortoise -c app.db.migration_config.TORTOISE_ORM migrate
