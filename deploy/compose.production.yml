# Combine with exactly one compose.django.yml or compose.fastapi.yml.
services:
  api:
    restart: unless-stopped
    volumes:
      - media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ../fastapi/docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - media:/data/media:ro
    depends_on:
      api:
        condition: service_healthy
volumes:
  media:
  redis:
